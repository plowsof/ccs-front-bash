name: check
# Runs on pull requests and on pushes to master.
on:
  push:
    branches: [master]
  pull_request:
# A newer commit on the same branch or PR cancels the run it replaces.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    # 22.04 has jq 1.6 and 24.04 has jq 1.7. Both must give the same pages.
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned by commit
      - name: mawk and gawk for the Markdown renderer, qrencode for the list's tools (tests/tools.sh)
        run: sudo apt-get update -q && sudo apt-get install -y -q mawk gawk qrencode
      - name: shellcheck
        run: shellcheck -x ccs-front-bash.sh lib/*.sh tests/*.sh container/*.sh tools/*.sh
      - name: tests
        run: tests/run.sh
      - name: the signing tool (signed subaddress list)
        run: tests/tools.sh
  image:
    # Build the pinned image with no network, then run the tests inside it.
    runs-on: ubuntu-24.04
    outputs:
      id: ${{ steps.id.outputs.id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned by commit
      - name: build (download, then install offline)
        run: container/build.sh ccs-front-bash
      - name: tests inside the image, no network
        run: docker run --rm --network none --read-only --tmpfs /tmp -v "$PWD:/src:ro" --entrypoint bash ccs-front-bash /src/tests/run.sh
      - id: id
        run: echo "id=$(docker image inspect ccs-front-bash --format '{{.Id}}')" >> "$GITHUB_OUTPUT"
  # The same commit must give the same image ID anywhere.
  # This builds on a second machine, under umask 077, on another commit's cache.
  pinned-warm:
    runs-on: ubuntu-24.04
    outputs:
      id: ${{ steps.id.outputs.id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned by commit
      - id: id
        run: |
          id=$(umask 077 && container/check-pinned.sh warm | sed -n 's/^id: //p')
          echo "warm: $id"
          echo "id=$id" >> "$GITHUB_OUTPUT"
  pinned:
    needs: [image, pinned-warm]
    runs-on: ubuntu-24.04
    steps:
      - name: pinned image hash (two machines, a clean build and a cached one, one ID)
        env:
          IDS: ${{ needs.image.outputs.id }} ${{ needs.pinned-warm.outputs.id }}
        run: |
          read -r a b <<<"$IDS"
          echo "clean build (and tests): $a"; echo "another machine, umask 077, on another commit's cache: $b"
          [[ $a == sha256:* && $a == "$b" ]] || { echo "error: the builds differ, or one is missing" >&2; exit 1; }
          echo "pinned: commit ${GITHUB_SHA::7} builds to $a"
