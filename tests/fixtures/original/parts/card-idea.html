<a class="card idea" href="{{url}}">
  <span class="tag"><span class="icon icon-bulb" aria-hidden="true"></span>
Idea</span>
  <h3>{{name}}</h3>
  <ul class="meta">
  <li><span class="icon icon-user" aria-hidden="true"></span>
{{author}}</li>
  <li><span class="icon icon-calendar" aria-hidden="true"></span>
{{date}}{{funding_note}}</li>
</ul>

  <p class="labels">{{tags}}</p>
  <p class="votes"><span title="Upvotes"><span class="icon icon-thumbs-up" aria-hidden="true"></span>
{{upvotes}}</span><span title="Downvotes"><span class="icon icon-thumbs-down" aria-hidden="true"></span>
{{downvotes}}</span></p>
</a>
