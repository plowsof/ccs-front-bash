<a class="card fr" href="{{url}}">
  <span class="tag"><span class="icon icon-hand-coins" aria-hidden="true"></span>
Funding Required</span>
  <h3>{{name}}</h3>
  <ul class="meta">
  <li><span class="icon icon-user" aria-hidden="true"></span>
{{author}}</li>
  <li><span class="icon icon-calendar" aria-hidden="true"></span>
{{date}}{{funding_note}}</li>
  <li><span class="icon icon-users" aria-hidden="true"></span>
{{contributors}} contributors</li>
  <li><span class="icon icon-coins" aria-hidden="true"></span>
{{amount}} XMR</li>
</ul>

  <p class="labels">{{tags}}</p>
  <p class="progress-label">Raised {{raised}} of {{amount}} XMR{{pending_note}}</p>
  <progress max="100" value="{{percentage}}">{{percentage}}%</progress>
</a>
