<a class="card wip" href="{{url}}">
  <span class="tag"><svg class="icon" aria-hidden="true"><use href="../assets/icons.svg#gear"></use></svg>
Work in Progress</span>
  <h3>{{name}}</h3>
  <ul class="meta">
  <li><svg class="icon" aria-hidden="true"><use href="../assets/icons.svg#user"></use></svg>
{{author}}</li>
  <li><svg class="icon" aria-hidden="true"><use href="../assets/icons.svg#calendar"></use></svg>
{{date}}{{funding_note}}</li>
  <li><svg class="icon" aria-hidden="true"><use href="../assets/icons.svg#users"></use></svg>
{{contributors}} contributors</li>
  <li><svg class="icon" aria-hidden="true"><use href="../assets/icons.svg#coins"></use></svg>
{{amount}} XMR</li>
</ul>

  <p class="labels">{{tags}}</p>
  <p class="progress-label">Completed {{done}} of {{milestones}} milestones</p>
  <div class="segments">{{segments}}</div>
</a>
